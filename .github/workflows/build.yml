name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Install Zig
        shell: powershell
        run: winget install --id zig.zig --exact --source winget --accept-package-agreements --accept-source-agreements --silent
      - name: Build and verify
        shell: powershell
        run: |
          $version = '0.4.2'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          .\scripts\build.ps1 -Version $version
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: PotPlayerFrameClip-windows
          path: |
            dist/PotPlayerFrameClip-*-Setup.exe
            dist/PotPlayerFrameClip-*-Setup.exe.sha256
      - name: Prepare draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # Missing releases are normal. Avoid stderr-based probing under
          # Windows PowerShell's terminating native-command error handling.
          $existingTags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw 'Release listing failed.' }
          if ($existingTags -contains $tag) { exit 0 }
          # Full installers are deliberately excluded until their source/license gate passes.
          $assets = @(Get-ChildItem -LiteralPath dist -File | Where-Object {
            $_.Name -eq "PotPlayerFrameClip-$tag-Setup.exe" -or $_.Name -eq "PotPlayerFrameClip-$tag-Setup.exe.sha256"
          } | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected one lightweight installer and checksum.' }
          gh release create $tag @assets --generate-notes --verify-tag --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
